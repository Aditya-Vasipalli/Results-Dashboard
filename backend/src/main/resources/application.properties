spring.application.name=results
server.port=${PORT:8080}
# Browsers send every cookie stored for "localhost" (from any project on any port), which can
# exceed Tomcat's 8 KB default and make every page fail with "400 Bad Request".
server.max-http-request-header-size=64KB

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vit_results}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# HMAC key for signing login tokens; must be at least 32 bytes. Override in any real deployment.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
# Start with `--app.reset=true` to wipe all data and reload the demo semester.
app.reset=false
